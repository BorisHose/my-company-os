<title>AI Head Office Prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: App-Rahmen mit linker Navigation (Unternehmen + Bereiche), Kopfzeile, Arbeitsfläche; Chat als rechtes Panel */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --fg:#141b2d; --muted:#5d6579; --line:#dde1ea;
  --ink:#16223f; --ink-soft:#e5e9f3; --accent:#c8641a; --accent-soft:#fbeee2;
  --ok:#147a5c; --ok-soft:#e1f3ec; --info:#2457c5; --info-soft:#e6edfb; --bad:#b4232a; --bad-soft:#fbe9ea;
  --bodo:#1f3a5f; --sell:#30ABE2;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d30; --sunk:#111829; --fg:#e8ecf5; --muted:#9aa3b9; --line:#283350;
  --ink:#a9bdf0; --ink-soft:#1f2a47; --accent:#f0a05e; --accent-soft:#3a2614;
  --ok:#5fd0aa; --ok-soft:#123a30; --info:#8fb0ff; --info-soft:#18284d; --bad:#ff8f8a; --bad-soft:#3d1c1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d30; --sunk:#111829; --fg:#e8ecf5; --muted:#9aa3b9; --line:#283350;
  --ink:#a9bdf0; --ink-soft:#1f2a47; --accent:#f0a05e; --accent-soft:#3a2614;
  --ok:#5fd0aa; --ok-soft:#123a30; --info:#8fb0ff; --info-soft:#18284d; --bad:#ff8f8a; --bad-soft:#3d1c1f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:204px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
.demo{grid-column:1/-1;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 14px;display:flex;gap:10px;flex-wrap:nowrap;align-items:center;white-space:nowrap;overflow:hidden}
.demo span{overflow:hidden;text-overflow:ellipsis}
.demo b{font-weight:700}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:12px 8px;font-size:13.5px;overflow:auto;min-height:0}
.logo{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em}
.logo b{font-size:15px;letter-spacing:-.01em}.logo small{display:block;color:var(--muted);font-size:11px}
.me *{pointer-events:none}
.me{margin-top:auto;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.me:hover,.me[aria-current="true"]{border-color:var(--ink);background:var(--ink-soft)}
.me b{display:block;font-size:13px}.me small{display:block;font-size:11px;color:var(--muted)}
.me{padding:6px 8px;gap:8px}.me .chev{margin-left:auto;font-size:18px !important;white-space:nowrap;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:2px}
.me:hover .chev{color:var(--ink)}
.ava{border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prof h2{margin:0}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:none;text-align:left;padding:6px 8px;font-size:13.5px;border-radius:8px;display:flex;gap:10px;align-items:center;color:var(--fg)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--ink-soft);color:var(--ink);font-weight:700}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px}
.co{display:flex;gap:9px;align-items:center}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.ic{width:18px;text-align:center;color:var(--muted);flex:none}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:12px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .crumb{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-weight:600}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.work{display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-height:0}

.view{overflow:auto;padding:20px 22px 96px;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;margin:0;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3{font-size:14px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.kpis{display:flex;gap:18px;flex-wrap:wrap}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.warn b{color:var(--accent)}.kpi.bad b{color:var(--bad)}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-run{background:var(--info-soft);color:var(--info)}.p-open{background:var(--sunk);color:var(--muted)}.p-wait{background:var(--accent-soft);color:var(--accent)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;align-items:flex-start}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.ava{width:34px;height:34px;border-radius:50%;background:var(--c,#1f3a5f);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
.ava.lead{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.ava.s{width:24px;height:24px;font-size:9.5px}
.bot{width:24px;height:24px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.conseq{background:var(--sunk);border-radius:9px;padding:9px 11px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.conseq .k{color:var(--muted);font-size:11.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.gf{border-top:4px solid var(--ink);display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;align-items:start}
.gf .who{display:flex;gap:12px;align-items:center}
.pa{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pa .ttl{display:flex;gap:10px;align-items:center}
.pa .spark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px}
.skills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.skills button.add{border-style:dashed;color:var(--muted)}
.orgtop{display:grid;grid-template-columns:1fr minmax(260px,320px) 1fr;align-items:center}
.gfbox{border-top:4px solid var(--ink);text-align:center;align-items:center}
.gfbox .ava{margin:4px auto}
.staff{display:flex;align-items:center;gap:0}
.staff .hl{width:34px;height:2px;background:var(--line);flex-shrink:0}
.staffcol{display:flex;flex-direction:column;gap:8px}
.asst{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface);padding:9px 12px;display:flex;gap:10px;align-items:center;text-align:left;max-width:270px}
.asst:hover{border-color:var(--accent)}
.asst .spark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.asst.human{border-left-color:var(--muted);border-style:dashed;color:var(--muted)}
.asst b{display:block;font-size:13px}.asst small{display:block;font-size:11.5px;color:var(--muted)}
.orgline{width:2px;height:18px;background:var(--line);margin:-4px auto -4px}
.sklist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.sk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);text-align:left}
.sk .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.sk[aria-pressed="true"] .bx{background:var(--ink);border-color:var(--ink)}
.sk b{display:block;font-size:13.5px}.sk small{color:var(--muted);font-size:12px}
@media (max-width:860px){.orgtop{grid-template-columns:1fr}.staff{justify-content:center;margin-top:10px}.staff .hl{display:none}}
.orgrow{border-top:2px solid var(--line);padding-top:14px}
@media (max-width:860px){.gf{grid-template-columns:1fr}}
.org{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.dept .head{display:flex;gap:11px;align-items:center}
.sec{display:flex;flex-direction:column;gap:6px}
.sec .m{display:flex;gap:8px;align-items:center;font-size:13px}
.alert{border-radius:8px;padding:7px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--accent)}
.alert.ok{background:var(--sunk);color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ink)}
.chain{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.step{min-width:150px;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.step b{font-size:13px}
.arrow{align-self:center;color:var(--muted)}
.pkgs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pkg{border-left:4px solid var(--c,var(--line))}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.tl li{display:flex;gap:8px;align-items:baseline}
.tl code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.eval{border:1px dashed var(--accent);border-radius:9px;padding:9px 11px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.eval .an{font-size:11px;color:var(--accent);font-weight:700}
.chat{position:fixed;right:20px;bottom:20px;width:400px;height:min(620px,calc(100vh - 110px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 48px rgba(10,14,28,.22);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat.big{top:48px;bottom:16px;height:auto;width:min(880px,calc(100vw - 48px));left:50%;right:auto;transform:translateX(-50%)}
.chat header .ib{border:0;background:none;width:30px;height:30px;border-radius:8px;font-size:16px;color:var(--muted)}
.chat header .ib:hover{background:var(--sunk)}
.fab{position:fixed;right:20px;bottom:20px;z-index:29;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 20px 12px 14px;background:var(--ink);color:var(--surface);font-weight:700;box-shadow:0 10px 28px rgba(10,14,28,.25)}
.fab .spark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.chat .hint{font-size:11px;color:var(--muted);padding:0 16px 10px}
.chat header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat header b{flex:1}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:13px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg ul{margin:4px 0 0;padding-left:18px}
.prev{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:6px;display:flex;flex-direction:column;gap:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px}
.composer{display:flex;gap:8px;padding:10px 16px 16px}
.composer input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);min-width:0}
.wiz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.wsteps{display:flex;flex-direction:column;gap:2px}
.wsteps button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:13px}
.wsteps button[aria-current="true"]{background:var(--ink-soft);color:var(--ink);font-weight:700}
.num{font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.wsteps .done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.tblw{overflow-x:auto}.tblw table{border-collapse:collapse;width:100%;font-size:13px}.tblw th,.tblw td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.tblw th{font-size:12px;color:var(--muted);font-weight:600}
.ta{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);line-height:1.45;resize:vertical}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.assist{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.assist .q{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field .val{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg)}
.conn{display:flex;gap:12px;align-items:center}
.conn .sym{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.modal{position:fixed;inset:0;background:rgba(10,14,28,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal .card{width:min(560px,100%);max-height:90%;overflow:auto}
.modal .card.wide{width:min(820px,100%)}
.agcard{text-align:left;cursor:pointer;font:inherit;color:inherit}
.agcard:hover{border-color:var(--ink);box-shadow:0 6px 18px rgba(10,14,28,.08)}
.agcard .open{font-size:12px;color:var(--info);font-weight:600}
.lv{display:inline-block;font-family:var(--f-mono);font-size:11px;border-radius:6px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.lv.l1{background:var(--info-soft);color:var(--info)}.lv.l2{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}
.perm{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.perm:last-child{border-bottom:0}
.sec2{display:flex;flex-direction:column;gap:8px}
.sec2 h3{margin:0;font-size:14px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:var(--surface);text-align:left}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 15px;border-radius:9px;font-size:13px;z-index:40}
.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:20;transform:translateX(-105%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,14,28,.4)}
  .menu-btn{display:inline-flex}
  .chat,.chat.big{inset:0;width:auto;height:auto;border-radius:0;transform:none}
  .wiz{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="demo"><b>Prototyp</b><span>Klickbare Vorschau · Beispieldaten · nichts wird gespeichert oder ausgeführt</span></div>
  <aside id="side">
    <div class="logo"><div class="mark">AI</div><div><b>AI Head Office</b><small>Arbeitstitel</small></div></div>
    <div class="lbl">Unternehmen</div>
    <div class="nav" id="companies"></div>
    <div class="lbl">Bereiche</div>
    <div class="nav" id="areas"></div>
    <button class="me" id="meBtn" aria-label="Profil und Einstellungen"><span id="meAva"></span><span><b>Boris Hose</b><small>Einstellungen</small></span><span class="chev" aria-hidden="true">›</span></button>
  </aside>
  <main>
    <div class="top">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menü">☰ Menü</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <button class="btn" id="newJob">+ Neuer Auftrag</button>
    </div>
    <div class="work" id="work">
      <section class="view" id="view"></section>
      <section class="chat" id="chat" hidden>
        <header><b>✦ KI-Assistent</b><span class="pill p-open" id="chatCo"></span><button class="ib" id="chatBig" aria-label="Größer anzeigen" title="Größer anzeigen">⤢</button><button class="ib" id="chatClose" aria-label="Minimieren" title="Minimieren">–</button></header>
        <div class="msgs" id="msgs"></div>
        <div class="chips" id="chips"></div>
        <form class="composer" id="composer"><input id="chatIn" placeholder="Frage oder Auftrag … (Diktat über die Tastatur möglich)" aria-label="Nachricht"><button class="btn pri">Senden</button></form>
        <div class="hint">KI kann Fehler machen. Was nach außen wirkt, wird vor dem Ausführen freigegeben.</div>
      </section>
    </div>
    <button class="fab" id="chatBtn"><span class="spark">✦</span>KI-Assistent</button>
  </main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>

function vSettings(){
  const t=state.setTab;
  const tabs=`<div class="tabs" role="tablist">${[["profil","Profil"],["firmen","Unternehmen"],["agents","Agenten & Skills"],["lib","Bibliothek"],["setup","Setup"],["conn","Anschlüsse"],["ki","KI & Daten"]].map(([k,l])=>`<button role="tab" aria-selected="${t===k}" data-stab="${k}">${l}</button>`).join("")}</div>`;

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;
  if(b.dataset.co){go({co:b.dataset.co,area:b.dataset.area||(state.area==="settings"?"cockpit":state.area)});return}
  if(b.dataset.area){go({area:b.dataset.area});return}
  if(b.dataset.go){if(["agents","lib","setup"].includes(b.dataset.go)){state.setTab=b.dataset.go;go({area:"settings"})}else go({area:b.dataset.go});return}
  if(b.dataset.ptab){state.projTab=b.dataset.ptab;render();return}
  if(b.id==="asstBtn"){skillModal();return}
  if(b.dataset.agent){agentModal(+b.dataset.agent);return}
  if(b.dataset.agsk){const a=AG[agI],k=b.dataset.agsk;a.sk=a.sk.includes(k)?a.sk.filter(x=>x!==k):[...a.sk,k];if(a.lim>skLv(a))a.lim=-1;agentModal(agI);return}
  if(b.dataset.aglim!==undefined){AG[agI].lim=+b.dataset.aglim;agentModal(agI);return}
  if(b.dataset.agp){const [k,v]=b.dataset.agp.split(":");AG[agI].p[k]=+v;agentModal(agI);return}
  if(b.hasAttribute("data-agsave")){$("#modal").innerHTML="";render();toast(AG[agI].n+" gespeichert (Prototyp)");return}
  if(b.hasAttribute("data-close-btn")){$("#modal").innerHTML="";render();return}
  if(b.hasAttribute("data-sk")){const i=+b.dataset.sk;PSK[i][2]=PSK[i][2]?0:1;b.setAttribute("aria-pressed",!!PSK[i][2]);b.querySelector(".bx").textContent=PSK[i][2]?"✓":"";$("#skcnt").textContent=PSK.filter(x=>x[2]).length;return}
  if(b.hasAttribute("data-skdone")){$("#modal").innerHTML="";render();toast("Fähigkeiten des Assistenten gespeichert (Prototyp)");return}
  if(b.dataset.stab){state.setTab=b.dataset.stab;go({area:"settings"});return}
  if(b.id==="meBtn"){state.setTab="profil";go({area:"settings"});return}
  if(b.dataset.assist){assistStage=+b.dataset.assist;render();return}
  if(b.dataset.step!==undefined){setupStep=+b.dataset.step;render();return}
  if(b.dataset.toast){toast(b.dataset.toast);return}
  if(b.dataset.ask){ask(b.dataset.ask);return}
  if(b.hasAttribute("data-opt")){b.parentElement.querySelectorAll("[data-opt]").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(b.hasAttribute("data-start")){$("#modal").innerHTML="";toast("Auftrag gestartet – Vertrieb ist informiert (Prototyp)");return}
  if(b.hasAttribute("data-close")&&e.target===b){$("#modal").innerHTML="";return}
  if(b.id==="newJob")newJob();
  if(b.id==="chatBtn")chatOpen($("#chat").hidden);
  if(b.id==="chatClose")chatOpen(false);
  if(b.id==="chatBig"){const c=$("#chat");c.classList.toggle("big");b.textContent=c.classList.contains("big")?"⤡":"⤢";b.setAttribute("aria-label",c.classList.contains("big")?"Kleiner anzeigen":"Größer anzeigen")}
  if(b.id==="menuBtn")$("#side").classList.toggle("open");
});
$("#composer").addEventListener("submit",e=>{e.preventDefault();const v=$("#chatIn").value.trim();if(!v)return;$("#chatIn").value="";ask(v)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#modal").innerHTML="";$("#side").classList.remove("open")}});
render();
